<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Eliza Chat - MVC CRUD Demo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!--Header-->
    <header class="app-header">
        <div class="container">
            <h1>💬 Eliza Chat</h1>
            <p class="subtitle">A therapeutic chatbot using MVC architecture</p>
        </div>
    </header>

    <!--Main Application-->
    <main class="app-main">
        <div class="container">

            <!--Stats Panel-->
            <div class="state=panel">
                <div class="stat-card">
                    <span class="stat-label">Messages</span>
                    <span class="stat-value" id="message-cont">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Last Saved</span>
                    <span class="stat-value" id="last-saved">Never</span>
                </div>
            </div>
            <!--Chat Container-->
            <div class="chat-container">
                <div id="chat-messages" class="chat-messages">
                    <!-- Messages will be rendered here by the view-->
                    <div class="empty-state">
                        <p>No messages yet. Start a new conversation</p>
                    </div>
                </div>
            </div>
            <!--Message Input Form-->
            <form id="message-form" class="message-form">
                <input
                type="text"
                id="message-input"
                class="message-input"
                placeholder="Type your message here..."
                autocomplete="off"
                required
                >
                <button type="Submit" class="send-button">Send</button>
            </form>
            <!--Controls Panel-->
            <div class="controls-panel">
                <button id="export-btn" class="control-button">
                    📥 Export Chat
                </button>
                <button id="import-btn" class="control-button">
                   📤 Import Chat 
                </button>
                <button id="clear-btn" class="control-button">
                    🗑️ Clear All
                </button>
                <input
                    type="file"
                    id="import-file"
                    accept=".json"
                    style="display: none;"
                >

            </div>
        </div>
    </main>

    <!--Footer-->
    <footer class="app-footer">
        <div class="container">
            <p>
                Built with MVC architecture |
                Data persisted with localStorage |
                <a href="https://github.com/ChloeO-03/-lab7-mvc-crud.git" target="_blank">View Source</a>
            </p>
        </div>
    </footer>
    <script type="module" src="js/app/js"></script>
</body>
</html>
